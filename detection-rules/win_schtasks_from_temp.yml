title: Scheduled Task Created to Run From User-Writable Path
id: 1c6be9d7-2a5b-4c49-a530-c27c9ce4c273
status: experimental
description: |
  Detects schtasks.exe creating a task whose action runs from a user-writable
  location (temp, downloads, appdata, public). Scheduled tasks are one of the
  most common persistence mechanisms, and legitimate software rarely persists
  binaries from these paths.
references:
  - https://attack.mitre.org/techniques/T1053/005/
author: Adam Paracausal Telemetry (Paracausal Telemetry)
date: 2026-06-10
tags:
  - attack.persistence
  - attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\schtasks.exe'
  selection_create:
    CommandLine|contains: '/create'
  selection_path:
    CommandLine|contains:
      - '\AppData\Local\Temp\'
      - '\AppData\Roaming\'
      - '\Users\Public\'
      - '\Downloads\'
      - '\Windows\Temp\'
      - '%temp%'
      - '%appdata%'
  condition: selection_img and selection_create and selection_path
falsepositives:
  - Some updaters (browsers, Electron apps) register tasks under AppData;
    baseline the common ones and alert on the remainder.
level: medium
