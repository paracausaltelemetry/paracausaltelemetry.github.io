name: Build content index and feed

on:
  schedule:
    - cron: "0 */6 * * *" # every 6h, safety net in case a dispatch is missed
  workflow_dispatch:
  # Fired by a small workflow in the CTF-Writeups repo on every push to main
  # (see writeups/FORMAT.md for the one-time setup there) — a new writeup
  # rebuilds the site within about a minute instead of waiting for the cron.
  repository_dispatch:
    types: [writeups-updated]
  push:
    branches: [main]
    paths:
      - "threat-actors/index.json"
      - "scripts/build-content-index.mjs"
      - "scripts/lib/site-shell.mjs"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build writeups index, feed, and sitemap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-content-index.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add writeups feed.xml sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Rebuild content index, feed, and sitemap"
            git push
          fi
